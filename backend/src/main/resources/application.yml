spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./backend/.env[.properties]

  application:
    name: servicedesk360

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servicedesk360}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  registration:
    # FIRST_WORKSPACE_ONLY closes public workspace creation after the first tenant.
    # Set REGISTRATION_MODE=OPEN only for an intentionally open multi-organization demo.
    mode: ${REGISTRATION_MODE:FIRST_WORKSPACE_ONLY}
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}

info:
  app:
    name: ServiceDesk 360
    description: Multi-tenant service desk platform
    phase: 3
